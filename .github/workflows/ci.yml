name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    name: Run e2e tests
    env:
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v7
      - name: Cache dev container base image
        run: docker pull mcr.microsoft.com/devcontainers/javascript-node:24
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm i
      - run: pnpm build
      - run: xvfb-run pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
